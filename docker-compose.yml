services:
  postgres:
    image: postgres:17-alpine
    container_name: gradual-postgres
    environment:
      POSTGRES_USER: gradual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradual_dev_password}
      POSTGRES_DB: gradual
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradual -d gradual"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: gradual-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-gradual_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gradual_dev_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
